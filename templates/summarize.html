<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="static/css/summarizer.css">
    <link rel="stylesheet" href="static/css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand">Summarify</div>
        <div class="nav-links">
            <span class="welcome-text">Welcome, {{ user }}</span>
            <a href="/dashboard">Dashboard</a>
            <a href="/logout" class="btn demo-btn">Logout</a>
        </div>
    </nav>

    <header class="hero">
        <h1>Text Summarizer</h1>
        <p class="hero-subtitle">
            Generate concise, intelligent summaries from your text using AI
        </p>
    </header>

    <div class="container">
        <div class="setup-section">
            <div class="input-group">
                <label for="apiKey">Groq API Key:</label>
                
                <input type="password" id="apiKey" placeholder="Enter your Groq API key">
            </div>

            <div class="input-group">
                <label for="summaryType">Summary Type:</label>
                
                <select id="summaryType">
                    <option value="custom">General Summary</option>
                    <option value="research">Research Paper</option>
                    <option value="financial">Financial Report</option>
                    <option value="technical">Technical Documentation</option>
                    <option value="meeting">Meeting Minutes (MoM)</option>
                    <option value="uml">UML Diagram</option>
                </select>
            </div>

            <div class="input-area">
                <label for="textInput">Text to Summarize:</label>
                <div class="input-group">
                    
                    <textarea 
                        id="textInput" 
                        class="text-input" 
                        placeholder="Paste your text here to generate a summary..."
                    ></textarea>
                </div>
            </div>

            <button id="summarizeButton" class="primary-button">
                <i class="fas fa-magic"></i> Generate Summary
            </button>
            <div id="status"></div>
        </div>

        <div class="summary-container">
            <h2>Summary</h2>
            <div class="summary-content" id="summaryContent">
                <p class="placeholder-text">Your summary will appear here after generation</p>
            </div>
            <button id="saveButton" class="secondary-button" style="display: none;">
                <i class="fas fa-save"></i> Save Summary
            </button>
        </div>
    </div>

    <script src="static\js\summarizer.js"></script>
</body>
</html>
